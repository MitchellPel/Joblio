server {
  listen 80;
  server_name _;

  # Health check
  location = /health {
    default_type text/plain;
    return 200 'joblio-ok\n';
  }

  # Same path shape Joblio already uses against Supabase
  location /rest/v1/ {
    proxy_pass http://postgrest:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Large JSON payloads (job lists / notes)
    client_max_body_size 20m;
    proxy_read_timeout 120s;
  }

  location / {
    default_type text/plain;
    return 200 'Joblio self-host gateway. Use /rest/v1/ …\n';
  }
}
