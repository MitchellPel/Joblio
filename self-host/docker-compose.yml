# Joblio lean self-host — Postgres + PostgREST (no full Supabase stack)
#
# On the office server (with Docker installed):
#   cd self-host
#   copy .env.example .env    # set a strong POSTGRES_PASSWORD
#   docker compose up -d
#
# API:  http://SERVER_LAN_IP:8080/rest/v1/
# DB:   SERVER_LAN_IP:5432  (user/db from .env)
#
# Proofs stay on the Windows share: \\server\Gary\Job Tracker\proofs\
# Do NOT publish port 8080 to the public internet.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-joblio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-joblio}
    volumes:
      - joblio_pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-joblio} -d ${POSTGRES_DB:-joblio}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgrest:
    image: postgrest/postgrest:v12.2.8
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER:-joblio}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-joblio}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: ${POSTGRES_USER:-joblio}
      PGRST_OPENAPI_MODE: disabled
      PGRST_DB_AGGREGATE_FUNCTIONS: "false"
      PGRST_SERVER_HOST: 0.0.0.0
      PGRST_SERVER_PORT: 3000
    # LAN-only trust: the joblio DB user is used for all API calls.
    # Keep this stack behind the office firewall.

  gateway:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - postgrest
    ports:
      - "${API_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  joblio_pgdata:
